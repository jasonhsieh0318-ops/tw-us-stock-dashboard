name: Update Taiwan & US Market Dashboard

on:
  schedule:
    # 每個工作天 (週一至週五) 台灣時間 18:00 (UTC 10:00) 自動執行
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊一鍵更新

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest Taiwan & US market data and render HTML
        env:
          TZ: Asia/Taipei
        run: |
          python3 update_dashboard.py
          python3 render_html.py

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market dashboard ($(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M'))"
            git push
          fi
